<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日待办</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230E2A3F'/%3E%3Cstop offset='1' stop-color='%230B1220'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='112' fill='url(%23g)'/%3E%3Cg fill='none' stroke-width='14' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='128' cy='180' r='34' stroke='%2322D3EE'/%3E%3Cpath d='M113 182l13 15 23-31' stroke='%2322D3EE'/%3E%3Ccircle cx='128' cy='300' r='34' stroke='%238CA3BF'/%3E%3Ccircle cx='128' cy='420' r='34' stroke='%238CA3BF'/%3E%3C/g%3E%3Crect x='190' y='162' width='190' height='36' rx='18' fill='%23E6F1FF'/%3E%3Crect x='190' y='282' width='145' height='36' rx='18' fill='%238CA3BF' opacity='.55'/%3E%3Crect x='190' y='402' width='165' height='36' rx='18' fill='%238CA3BF' opacity='.32'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0B1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1220;
    --paper:rgba(17,27,47,.72);
    --ink:#E6F1FF;
    --muted:#8CA3BF;
    --line:rgba(140,170,210,.16);
    --accent:#22D3EE;
    --accent-soft:rgba(34,211,238,.13);
    --hi:#F87171;
    --mid:#FBBF24;
    --lo:#8CA3BF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    color:var(--ink);
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:16px;
    line-height:1.6;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:48px 20px 80px;
    background-color:#0B1220;
    background-image:
      linear-gradient(rgba(120,180,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,180,255,.05) 1px, transparent 1px),
      radial-gradient(circle at 1px 1px, rgba(120,180,255,.11) 1px, transparent 0);
    background-size:44px 44px,44px 44px,11px 11px;
    background-attachment:fixed;
  }
  /* 环境光斑：两团缓慢漂移的青蓝辉光 */
  body::before,body::after{
    content:"";position:fixed;border-radius:50%;
    filter:blur(90px);pointer-events:none;z-index:-1;
  }
  body::before{width:48vmax;height:48vmax;left:-14vmax;top:-16vmax;
    background:radial-gradient(closest-side,rgba(34,211,238,.20),transparent);
    animation:drift1 26s ease-in-out infinite alternate}
  body::after{width:55vmax;height:55vmax;right:-16vmax;bottom:-20vmax;
    background:radial-gradient(closest-side,rgba(59,130,246,.18),transparent);
    animation:drift2 34s ease-in-out infinite alternate}
  @keyframes drift1{to{transform:translate(9vmax,7vmax) scale(1.18)}}
  @keyframes drift2{to{transform:translate(-10vmax,-6vmax) scale(1.12)}}
  @media (prefers-reduced-motion:reduce){body::before,body::after{animation:none}}
  .sheet{width:100%;max-width:640px;position:relative}
  .sheet::before{ /* 顶部能量线 */
    content:"";position:absolute;top:-18px;left:-6px;right:-6px;height:2px;
    background:linear-gradient(90deg,transparent 5%,rgba(34,211,238,.5) 30%,rgba(34,211,238,.95) 50%,rgba(34,211,238,.5) 70%,transparent 95%);
    filter:drop-shadow(0 0 8px rgba(34,211,238,.7));
  }

  /* ---- 日期头 ---- */
  header{margin-bottom:8px}
  .datebar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  h1{
    font-family:"Noto Serif SC","Source Han Serif SC","SimSun",serif;
    font-weight:700;
    font-size:clamp(30px,6vw,42px);
    letter-spacing:.02em;
    line-height:1.25;
  }
  h1 .weekday{font-size:.5em;color:var(--muted);margin-left:.5em;font-weight:600}
  .daynav{display:flex;gap:10px;align-items:flex-start;margin-left:auto}
  .navitem{display:flex;flex-direction:column;align-items:center;gap:4px}
  .navitem i{font-style:normal;font-size:10px;line-height:1;
    color:var(--muted);white-space:nowrap;opacity:.85}
  .navitem .backtoday{margin-bottom:14px} /* 有文字的胶囊按钮与圆形按钮对齐 */
  .daynav button{
    flex:none;
    border:1px solid var(--line);background:var(--paper);color:var(--muted);
    width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;
    transition:color .15s,border-color .15s;
  }
  .daynav button:hover{color:var(--ink);border-color:var(--muted)}
  .clock{
    font-family:ui-monospace,Consolas,"Courier New",monospace;
    font-variant-numeric:tabular-nums;
    font-size:13px;color:var(--accent);
    letter-spacing:.08em;
    padding:2px 0 2px 10px;
    border-left:1px solid var(--line);
    margin-left:6px;
  }
  .backtoday{
    flex:none;white-space:nowrap;
    border:1px solid var(--accent);background:none;color:var(--accent);
    height:34px;padding:0 14px;border-radius:17px;font-size:13px;cursor:pointer;
  }
  .backtoday:hover{background:var(--accent-soft)}

  /* ---- 进度 ---- */
  .progress{margin:14px 0 26px}
  .progress .nums{font-size:13px;color:var(--muted);margin-bottom:6px}
  .progress .nums b{color:var(--accent);font-weight:500}
  .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
  .dateline{
    margin:10px 0 22px;font-size:13px;color:var(--muted);
    font-family:ui-monospace,Consolas,"Courier New",monospace;
    letter-spacing:.08em;display:flex;align-items:center;gap:8px;
  }
  .dateline::before{content:"";width:10px;height:2px;background:var(--accent);
    box-shadow:0 0 6px rgba(34,211,238,.7)}
  .dateline .clock{margin-left:auto;border-left:none;padding:0}
  /* 标题与翻页键之间的装饰：点阵带 + 末端光标 */
  .dateart{flex:1;min-width:60px;height:36px;position:relative}
  .dateart::before{
    content:"";position:absolute;left:0;right:26px;top:50%;height:8px;
    transform:translateY(-50%);
    background-image:radial-gradient(circle,rgba(34,211,238,.45) 1.5px,transparent 2px);
    background-size:14px 8px;background-position:left center;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 20%,#000 88%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 20%,#000 88%,transparent);
  }
  .dateart::after{
    content:"";position:absolute;right:6px;top:50%;width:3px;height:14px;
    transform:translateY(-50%);border-radius:2px;
    background:var(--accent);box-shadow:0 0 8px rgba(34,211,238,.8);
  }
  @media (max-width:640px){.dateart{display:none}}

  /* ---- 日历快切 ---- */
  .calwrap{position:relative}
  .cal{position:absolute;top:10px;left:0;z-index:30;min-width:302px;
    background:rgba(17,27,47,.94);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:12px;padding:14px;
    box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .cal[hidden]{display:none}
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .calhead .clabel{font-size:14px;color:var(--ink);font-weight:500;
    font-family:ui-monospace,Consolas,monospace;letter-spacing:.05em}
  .calnav{border:none;background:none;color:var(--muted);cursor:pointer;
    font-size:16px;width:30px;height:30px;border-radius:8px}
  .calnav:hover{color:var(--accent);background:var(--accent-soft)}
  .cal table{width:100%;border-collapse:collapse}
  .cal th{font-size:11px;color:var(--muted);font-weight:400;padding:4px 0}
  .cal td{padding:2px;text-align:center}
  .cal td button{width:36px;height:32px;border:none;background:none;color:var(--ink);
    font:inherit;font-size:13px;border-radius:8px;cursor:pointer;position:relative}
  .cal td button:hover{background:var(--accent-soft)}
  .cal td button.sel{background:var(--accent);color:#031018;font-weight:600}
  .cal td button.today{box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
  .cal td button.sel.today{color:#031018}
  .cal td button.has::after{content:"";position:absolute;left:50%;bottom:3px;
    width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
  .cal td button.sel.has::after{background:#031018}
  .cal td button.blank{visibility:hidden;pointer-events:none}
  .calfoot{margin-top:10px;text-align:center}
  .calfoot button{border:none;background:none;color:var(--accent);cursor:pointer;
    font-size:13px;padding:4px 10px;border-radius:12px}
  .calfoot button:hover{background:var(--accent-soft)}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#0891B2,#22D3EE);
    border-radius:2px;box-shadow:0 0 10px rgba(34,211,238,.65);
    transition:width .35s ease;min-width:0}

  /* ---- 输入行 ---- */
  .composer{
    display:flex;gap:8px;align-items:center;
    background:rgba(17,27,47,.72);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:10px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 4px 24px rgba(0,0,0,.35);
    padding:8px 8px 8px 16px;
    transition:border-color .15s,box-shadow .15s;
  }
  .composer:focus-within{border-color:rgba(34,211,238,.55);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 0 3px rgba(34,211,238,.14),0 4px 24px rgba(0,0,0,.35)}
  .composer input[type=text]{
    flex:1;min-width:0;border:none;outline:none;background:none;
    font:inherit;color:var(--ink);
  }
  .composer input[type=text]::placeholder{color:#56698A}
  .composer input[type=time]{
    border:none;outline:none;background:none;font:inherit;font-size:14px;
    color:var(--muted);width:88px;
  }
  .pri{
    border:none;background:var(--accent-soft);color:var(--accent);
    height:34px;padding:0 12px;border-radius:17px;font-size:13px;cursor:pointer;
    white-space:nowrap;
  }
  .pri[data-v="2"]{background:rgba(248,113,113,.15);color:var(--hi)}
  .pri[data-v="1"]{background:rgba(251,191,36,.15);color:var(--mid)}
  #periodBtn{background:var(--accent-soft);color:var(--accent)}
  .add{
    border:none;color:#031018;cursor:pointer;
    height:34px;padding:0 18px;border-radius:17px;font-size:14px;font-weight:500;
    background:linear-gradient(180deg,#22D3EE,#0891B2);
    box-shadow:0 2px 12px rgba(34,211,238,.4);
    transition:box-shadow .15s,transform .15s;
  }
  .add:hover{box-shadow:0 3px 18px rgba(34,211,238,.6);transform:translateY(-1px)}
  .add:active{transform:none}

  /* ---- 列表 ---- */
  ul{list-style:none;margin-top:22px}
  li{
    display:flex;align-items:center;gap:12px;
    padding:12px 6px;border-bottom:1px solid var(--line);
    animation:in .18s ease;
  }
  @keyframes in{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){li{animation:none}.bar i{transition:none}}

  .check{
    flex:none;width:22px;height:22px;border:1.5px solid var(--muted);
    border-radius:50%;background:none;cursor:pointer;position:relative;
  }
  .check:hover{border-color:var(--accent)}
  .check::after{ /* 对勾 */
    content:"";position:absolute;left:6px;top:3px;width:6px;height:11px;
    border:solid var(--accent);border-width:0 2px 2px 0;
    transform:rotate(45deg) scale(0);transition:transform .15s ease;
  }
  li.done .check,li.completing .check{background:var(--accent-soft);border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(34,211,238,.12),0 0 10px rgba(34,211,238,.35)}
  li.done .check::after{transform:rotate(45deg) scale(1)}
  /* 勾勾描画：从左往右“写”出来 */
  li.completing .check::after{
    transform:rotate(45deg) scale(1);
    animation:drawcheck .5s ease .1s both;
  }
  @keyframes drawcheck{
    from{clip-path:inset(-30% 100% -30% -10%)}
    to{clip-path:inset(-30% -10% -30% -10%)}
  }

  .task{flex:1;min-width:0;cursor:text;word-break:break-word;position:relative}
  /* 划掉的横线：从左到右生长 */
  .task::after{
    content:"";position:absolute;left:0;top:50%;width:100%;height:1.5px;
    background:var(--muted);border-radius:1px;
    transform:scaleX(0);transform-origin:left center;
  }
  li.completing .task::after,li.done .task::after{transform:scaleX(1)}
  .task .edit{
    width:100%;border:none;outline:none;background:none;font:inherit;color:var(--ink);
    border-bottom:1px dashed var(--muted);
  }
  .pdot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--lo)}
  .pdot[data-v="2"]{background:var(--hi)}
  .pdot[data-v="1"]{background:var(--mid)}
  .ptag{flex:none;font-size:11px;line-height:1.7;padding:0 8px;border-radius:9px;
    cursor:pointer;user-select:-webkit-user-select;user-select:none;transition:filter .15s}
  .ptag:hover{filter:brightness(1.35)}
  .ptag[data-v="2"]{color:var(--hi);background:rgba(248,113,113,.13)}
  .ptag[data-v="1"]{color:var(--mid);background:rgba(251,191,36,.13)}
  .ptag[data-v="0"]{color:var(--muted);background:rgba(140,163,191,.14)}
  .time{flex:none;font-size:13px;color:var(--muted);
    font-family:ui-monospace,Consolas,"Courier New",monospace;
    font-variant-numeric:tabular-nums}
  .del{
    flex:none;border:none;background:none;color:rgba(140,170,210,.45);cursor:pointer;
    font-size:17px;line-height:1;padding:2px 4px;border-radius:4px;
    opacity:0;transition:opacity .15s,color .15s;
  }
  li:hover .del,.del:focus-visible{opacity:1}
  .del:hover{color:var(--hi)}

  li:hover{background:linear-gradient(90deg,rgba(34,211,238,.07),transparent 70%)}

  /* 分组标题：紧急 / 重要 / 普通 / 已完成 */
  li.sechead{
    display:flex;align-items:baseline;gap:10px;
    padding:26px 6px 8px;
    font-family:"Noto Serif SC","Source Han Serif SC","SimSun",serif;
    font-size:20px;font-weight:700;color:var(--ink);
    letter-spacing:.04em;
  }
  li.sechead:first-child{padding-top:8px}
  li.sechead .sdot{flex:none;width:10px;height:10px;border-radius:50%;
    align-self:center}
  li.sechead.gm .sdot{background:var(--mid);box-shadow:0 0 6px rgba(251,191,36,.5)}
  li.sechead.gn .sdot{background:var(--accent);box-shadow:0 0 6px rgba(34,211,238,.5)}
  li.sechead.ga .sdot{background:#A78BFA;box-shadow:0 0 6px rgba(167,139,250,.5)}
  li.sechead.gw .sdot{background:#60A5FA;box-shadow:0 0 6px rgba(96,165,250,.5)}
  li.sechead.gd .sdot{background:var(--muted)}
  li.sechead .cnt{color:var(--muted);font-size:12px;font-weight:400;
    font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
  li.sechead::after{content:"";flex:1;height:1px;align-self:center;
    background:linear-gradient(90deg,var(--line),transparent)}
  li.done .task{color:var(--muted)}
  li.done{opacity:.5;transition:opacity .4s ease}
  li.done:hover{opacity:.85}
  /* 下沉离场：淡出 + 轻微下坠 */
  li.leaving{
    opacity:0;transform:translateY(12px);
    transition:opacity .4s ease,transform .4s ease;
  }

  /* ---- 底部筛选 ---- */
  @keyframes flashbg{0%{background:var(--accent-soft)}100%{background:transparent}}
  li.flash{animation:flashbg 1.2s ease}

  /* ---- 顺延标记 / 拖拽 / 搜索 ---- */
  .carry{flex:none;font-size:11px;color:var(--accent);cursor:pointer;
    border:1px dashed var(--accent);border-radius:6px;padding:0 5px;opacity:.85;
    background:none;font-family:inherit;transition:background .15s,color .15s}
  .carry:hover{background:var(--accent-soft)}
  li[data-id]{touch-action:pan-y}
  li.dragging{z-index:5;opacity:.92;background:var(--accent-soft);
    box-shadow:0 8px 24px rgba(0,0,0,.4);border-radius:8px}
  body.noselect{user-select:none;-webkit-user-select:none}
  #searchInput{width:100%;background:rgba(11,18,32,.8);border:1px solid var(--line);
    border-radius:8px;color:var(--ink);font:inherit;font-size:14px;padding:8px 10px;
    outline:none;margin-bottom:8px}
  #searchInput:focus{border-color:var(--accent)}
  .sres{display:flex;gap:8px;align-items:baseline;padding:8px 6px;
    border-top:1px solid var(--line);cursor:pointer;font-size:14px}
  .sres:hover{color:var(--accent)}
  .sres .sd{color:var(--muted);font-size:12px;flex:none;
    font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
  .sres .sn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---- 浅色主题 ---- */
  body.light{
    --bg:#EDF1EA;--paper:rgba(251,252,250,.88);--ink:#17251D;--muted:#5C6B61;
    --line:rgba(23,37,29,.14);--accent:#0E7A5F;--accent-soft:rgba(14,122,95,.12);
    --hi:#C0392B;--mid:#A8710D;--lo:#5C6B61;
    background-color:#EDF1EA;
    background-image:
      linear-gradient(rgba(23,37,29,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(23,37,29,.05) 1px,transparent 1px),
      radial-gradient(circle at 1px 1px,rgba(23,37,29,.10) 1px,transparent 0);
    background-size:44px 44px,44px 44px,11px 11px;
  }
  body.light::before{background:radial-gradient(closest-side,rgba(14,122,95,.16),transparent)}
  body.light::after{background:radial-gradient(closest-side,rgba(14,110,85,.10),transparent)}
  body.light .sheet::before{background:linear-gradient(90deg,transparent 5%,rgba(14,122,95,.5) 30%,rgba(26,163,126,.9) 50%,rgba(14,122,95,.5) 70%,transparent 95%)}
  body.light .bar i{background:linear-gradient(90deg,#0E7A5F,#1AA37E);box-shadow:0 0 8px rgba(26,163,126,.4)}
  body.light .composer{box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 4px 18px rgba(23,37,29,.08)}
  body.light .composer:focus-within{box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 0 0 3px rgba(14,122,95,.12),0 4px 18px rgba(23,37,29,.08)}
  body.light .add{background:linear-gradient(180deg,#128767,#0B5B46);color:#fff;box-shadow:0 2px 10px rgba(14,122,95,.35)}
  body.light li.done .check{box-shadow:0 0 0 3px rgba(14,122,95,.12),0 0 8px rgba(26,163,126,.3)}
  body.light .dateline::before{box-shadow:none}
  body.light .dateart::before{background-image:radial-gradient(circle,rgba(14,122,95,.4) 1.5px,transparent 2px)}
  body.light .dateart::after{box-shadow:none}
  body.light .cal,body.light .rembox{background:rgba(251,252,250,.97);box-shadow:0 12px 40px rgba(23,37,29,.18)}
  body.light .rembox input,body.light .rembox select,body.light #searchInput{background:#fff;color:var(--ink)}
  body.light .lightbox{background:rgba(240,244,238,.92)}
  body.light .lbbtn{background:#fff;color:var(--ink)}
  body.light li.dragging{box-shadow:0 8px 24px rgba(23,37,29,.25)}

  /* ---- 滑动转场性能：动画期间关掉毛玻璃 ---- */
  .sheet.swiping{will-change:transform}
  .sheet.swiping .composer,.sheet.swiping .rembox,.sheet.swiping .cal,
  .sheet.swiping .lightbox{
    -webkit-backdrop-filter:none;backdrop-filter:none;
    background:rgba(11,18,32,.97);
  }
  body.light .sheet.swiping .composer,body.light .sheet.swiping .cal,
  body.light .sheet.swiping .rembox{
    background:rgba(251,252,250,.97);
  }
  .primarybtn{background:linear-gradient(180deg,#22D3EE,#0891B2)!important;
    color:#031018!important;border:none!important;font-weight:500!important}

  .empty{
    margin-top:34px;text-align:center;color:var(--muted);font-size:14px;
    font-family:"Noto Serif SC","SimSun",serif;
  }

  /* ---- 任务附图 ---- */
  .thumb{flex:none;width:38px;height:38px;object-fit:cover;border-radius:6px;
    border:1px solid var(--line);cursor:zoom-in;transition:border-color .15s}
  .thumb:hover{border-color:var(--accent)}
  #imgPreview{display:flex;align-items:center;gap:4px;flex:none}
  #imgPreview:empty{display:none}
  #imgPreview img{width:34px;height:34px;object-fit:cover;border-radius:6px;
    border:1px solid var(--accent)}
  .prevrm{border:none;background:none;color:var(--muted);cursor:pointer;
    font-size:14px;line-height:1;padding:2px}
  .prevrm:hover{color:var(--hi)}
  .clip{border:none;background:none;color:var(--muted);font-size:15px;
    cursor:pointer;padding:2px 4px;border-radius:4px}
  .clip:hover{color:var(--accent)}
  .lightbox{position:fixed;inset:0;z-index:50;padding:24px;
    background:rgba(3,8,18,.88);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    opacity:0;transition:opacity .25s ease}
  .lightbox.open{opacity:1}
  .lightbox[hidden]{display:none}
  .lightbox img{max-width:92vw;max-height:76vh;border-radius:8px;
    border:1px solid var(--line);box-shadow:0 8px 40px rgba(0,0,0,.5)}
  .lbbar{display:flex;gap:10px}
  .lbbtn{border:1px solid var(--line);background:rgba(17,27,47,.8);color:var(--ink);
    padding:6px 16px;border-radius:16px;font-size:13px;cursor:pointer}
  .lbbtn:hover{border-color:var(--accent);color:var(--accent)}
  .lbbtn.danger:hover{border-color:var(--hi);color:var(--hi)}

  /* ---- 提醒 ---- */
  .bell{flex:none;border:none;background:none;cursor:pointer;font-size:14px;
    padding:2px;filter:grayscale(1);opacity:.4;transition:opacity .15s,filter .15s}
  .bell:hover{opacity:.9}
  .bell.on{filter:none;opacity:1}
  .remdlg{position:fixed;inset:0;z-index:60;background:rgba(3,8,18,.8);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;padding:20px;
    opacity:0;transition:opacity .22s ease}
  .remdlg.open{opacity:1}
  .remdlg[hidden]{display:none}
  .rembox{width:100%;max-width:340px;background:rgba(17,27,47,.96);
    border:1px solid var(--line);border-radius:12px;padding:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:12px;
    transform:translateY(16px) scale(.94);
    transition:transform .22s cubic-bezier(.2,.7,.3,1)}
  .remdlg.open .rembox{transform:none}
  @media (prefers-reduced-motion:reduce){
    .remdlg{transition:none}.rembox{transform:none;transition:none}
  }
  .remtask{font-size:15px;color:var(--ink);word-break:break-word;line-height:1.5}
  .rembox label{display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-size:13px;color:var(--muted);flex-wrap:wrap}
  .rembox input{background:rgba(11,18,32,.8);border:1px solid var(--line);
    border-radius:8px;color:var(--ink);font:inherit;font-size:14px;padding:6px 10px;
    outline:none;min-width:0}
  .rembox input:focus{border-color:var(--accent)}
  .remrow{display:flex;gap:10px}
  .remrow label{flex:1;justify-content:flex-start;gap:6px}
  .rembox select{background:rgba(11,18,32,.8);border:1px solid var(--line);
    border-radius:8px;color:var(--ink);font:inherit;font-size:13px;
    padding:6px;outline:none;flex:1;min-width:0}
  .rembox select:focus{border-color:var(--accent)}
  #remTopic{flex:1;width:100%}
  .remhint{font-size:12px;color:#56698A;line-height:1.6}
  .remstatus{font-size:13px;min-height:1.2em;color:var(--muted);line-height:1.5}
  .rembtns{display:flex;gap:8px;flex-wrap:wrap}
  .rembtns button{flex:1;border:1px solid var(--line);background:rgba(11,18,32,.6);
    color:var(--ink);font-size:13px;padding:8px 6px;border-radius:9px;cursor:pointer;
    white-space:nowrap;transition:border-color .15s,color .15s}
  .rembtns button:hover{border-color:var(--accent);color:var(--accent)}
  #remNtfy{border-color:rgba(34,211,238,.45);color:var(--accent)}
  .empty small{display:block;margin-top:6px;font-family:inherit;color:#56698A}

  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .composer input:focus-visible,.task .edit:focus-visible{outline:none}
  @media (max-width:480px){
    body{padding:28px 14px 60px}
    .del{opacity:.6}
    /* 窄屏：导航键整体换行，不再挤压"回到今天" */
    .daynav{flex-wrap:wrap;row-gap:8px;width:100%;justify-content:flex-end}
    .daynav button{width:30px;height:30px;font-size:14px}
    .daynav .backtoday{width:auto;height:30px;padding:0 12px;font-size:12px}
  }
</style>
</head>
<body>
<main class="sheet">
  <header>
    <div class="datebar">
      <h1 id="dateTitle">今日待办</h1>
      <div class="dateart" aria-hidden="true"></div>
      <div class="daynav">
        <span class="navitem"><button id="searchBtn" title="搜索待办">🔍</button><i>搜索</i></span>
        <span class="navitem"><button id="calBtn" title="选择日期">▦</button><i>日历</i></span>
        <span class="navitem"><button id="prevDay" title="前一天" aria-label="前一天">‹</button><i>前一天</i></span>
        <span class="navitem"><button id="nextDay" title="后一天" aria-label="后一天">›</button><i>后一天</i></span>
        <span class="navitem"><button id="themeBtn" title="切换深浅色">☀️</button><i>主题</i></span>
        <span class="navitem"><button id="backToday" class="backtoday" hidden>回到今天</button></span>
      </div>
    </div>
    <div class="calwrap">
      <div class="cal" id="searchPanel" hidden>
        <input type="text" id="searchInput" placeholder="搜索所有日期的待办…" autocomplete="off">
        <div id="searchResults"></div>
      </div>
      <div class="cal" id="calPanel" hidden></div>
    </div>
    <div class="progress">
      <div class="nums" id="nums"></div>
      <div class="bar"><i id="barFill" style="width:0"></i></div>
    </div>
    <div class="dateline" id="dateLine"><span id="dateText"></span><span class="clock" id="clock">--:--:--</span></div>
  </header>

  <form class="composer" id="composer">
    <input type="text" id="newTask" placeholder="要做点什么？可 Ctrl+V 粘贴截图" maxlength="120" autocomplete="off">
    <button type="button" class="pri" id="periodBtn" data-v="1" title="切换时间段">中午</button>
    <div id="imgPreview"></div>
    <button type="button" class="clip" id="clipBtn" title="添加图片">📎</button>
    <button type="button" class="pri" id="priBtn" data-v="0" title="切换优先级">普通</button>
    <button type="submit" class="add">添加</button>
    <input type="file" id="imgInput" accept="image/*" hidden>
  </form>

  <ul id="list"></ul>
  <div class="empty" id="empty" hidden>纸上还空着<small>写下今天的第一件事</small></div>

  <div class="remdlg" id="cfmDialog" hidden>
    <div class="rembox">
      <div class="remtask" id="cfmText"></div>
      <div class="remhint">确认把这条待办顺延到明天吗？它将移动到明天的列表中。</div>
      <div class="rembtns">
        <button id="cfmNo" type="button">取消</button>
        <button id="cfmYes" type="button" class="primarybtn">确认顺延</button>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" hidden></div>

  <div class="remdlg" id="remDialog" hidden>    <div class="rembox">
      <div class="remtask" id="remTaskName"></div>
      <div class="remrow">
        <label>时段<select id="remPeriod">
          <option value="0">早上</option><option value="1">中午</option>
          <option value="2">下午</option><option value="3">晚上</option>
        </select></label>
        <label>重复<select id="remRepeat">
          <option value="">不重复</option><option value="daily">每天</option>
          <option value="weekly">每周</option><option value="monthly">每月</option>
        </select></label>
      </div>
      <label>提醒时间<input type="datetime-local" id="remTime"></label>
      <label>推送桥地址（可选）<input type="text" id="remWorker" placeholder="https://xxx.workers.dev，填了关浏览器也能推" autocomplete="off"></label>
      <label>WxPusher appToken<input type="text" id="remToken" placeholder="AT_ 开头" autocomplete="off"></label>
      <label>WxPusher UID<input type="text" id="remUid" placeholder="UID_ 开头" autocomplete="off"></label>
      <div class="remhint">填了推送桥地址：提醒存入服务器，到点由服务器发到 WxPusher App，浏览器关闭也有效；不填：由本页面到点直发（需页面保持打开）。日历导出作为零依赖兜底。</div>
      <div class="remstatus" id="remStatus"></div>
      <div class="rembtns">
        <button id="remWx" type="button">微信推送</button>
        <button id="remIcs" type="button">下载日历文件</button>
        <button id="remAllIcs" type="button">导出全部提醒</button>
        <button id="remClose" type="button">关闭</button>
      </div>
    </div>
  </div>
</main>

<script>
(function(){
  var KEY='dayplan.v1.';
  // 时段从 3 档扩为 4 档：旧数据里 period=2（晚上）整体平移为 3
  if(!localStorage.getItem('dayplan.pm3')){
    for(var _i=0;_i<localStorage.length;_i++){
      var _k=localStorage.key(_i);
      if(_k&&_k.indexOf(KEY)===0){
        try{
          var _arr=JSON.parse(localStorage.getItem(_k));
          _arr.forEach(function(x){if(x.period===2)x.period=3});
          localStorage.setItem(_k,JSON.stringify(_arr));
        }catch(e){}
      }
    }
    localStorage.setItem('dayplan.pm3','1');
  }
  var PRI=['普通','重要','紧急'];
  var PERIOD=['早上','中午','下午','晚上'];
  function currentPeriod(){var h=new Date().getHours();return h<12?0:h<14?1:h<18?2:3}
  var state={date:todayStr(),pri:0,period:currentPeriod()};

  function todayStr(){var d=new Date();return fmt(d)}
  function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
  function shift(n){var d=parse(state.date);d.setDate(d.getDate()+n);state.date=fmt(d);render()}
  function load(){
    try{
      var list=JSON.parse(localStorage.getItem(KEY+state.date))||[];
      // 旧数据迁移：具体时间 → 时段
      list.forEach(function(x){
        if(x.period==null){
          if(x.time){var h=+x.time.slice(0,2);x.period=h<12?0:h<14?1:h<18?2:3}
          else x.period=1;
          delete x.time;
        }
      });
      return list;
    }catch(e){return[]}
  }

  function isToday(){return state.date===todayStr()}
  function weekday(t){return '日一二三四五六'[t.getDay()]}

  function sortList(list){
    list.sort(function(a,b){
      if(a.done!==b.done)return a.done?1:-1;
      if(a.period!==b.period)return a.period-b.period;
      var ao=a.ord==null?1e12:a.ord, bo=b.ord==null?1e12:b.ord;
      if(ao!==bo||a.ord!=null||b.ord!=null)return ao-bo; // 手动拖过的顺序优先
      if(a.pri!==b.pri)return b.pri-a.pri;
      return a.created-b.created;
    });
    return list;
  }

  function addTask(text,pri,period,img){
    var list=load();
    list.push({id:Date.now()+''+Math.floor(Math.random()*1e4),text:text,pri:pri,period:period,done:false,img:img||null,created:Date.now()});
    save(sortList(list));render();
  }

  function save(list){
    try{localStorage.setItem(KEY+state.date,JSON.stringify(list))}
    catch(e){alert('本地存储空间不足：图片太多或太大，建议删掉一些带图任务')}
  }

  /* ---- 图片：压缩 → 暂存 → 随任务提交 ---- */
  function compressImage(file,cb){
    var img=new Image();
    var url=URL.createObjectURL(file);
    img.onload=function(){
      var max=1280,w=img.width,h=img.height;
      if(w>max){h=Math.round(h*max/w);w=max}
      var c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      cb(c.toDataURL('image/jpeg',0.72));
    };
    img.src=url;
  }
  function setPending(dataUrl){
    state.pendingImg=dataUrl||null;
    var pv=document.getElementById('imgPreview');
    pv.innerHTML='';
    if(dataUrl){
      var im=document.createElement('img');im.src=dataUrl;im.alt='待附加的截图';
      var rm=document.createElement('button');rm.type='button';rm.className='prevrm';
      rm.textContent='×';rm.setAttribute('aria-label','移除图片');
      rm.addEventListener('click',function(){setPending(null)});
      pv.append(im,rm);
    }
  }
  document.getElementById('clipBtn').addEventListener('click',function(){
    document.getElementById('imgInput').click();
  });
  document.getElementById('imgInput').addEventListener('change',function(){
    if(this.files[0])compressImage(this.files[0],setPending);
    this.value='';
  });
  document.addEventListener('paste',function(e){
    var items=e.clipboardData&&e.clipboardData.items;
    if(!items)return;
    for(var i=0;i<items.length;i++){
      if(items[i].type.indexOf('image')===0){
        e.preventDefault();
        compressImage(items[i].getAsFile(),setPending);
        return;
      }
    }
  });
  var composerEl=document.getElementById('composer');
  composerEl.addEventListener('dragover',function(e){e.preventDefault()});
  composerEl.addEventListener('drop',function(e){
    e.preventDefault();
    if(e.dataTransfer.files[0])compressImage(e.dataTransfer.files[0],setPending);
  });

  /* ---- 看大图 / 删图（共享元素动画） ---- */
  var reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var lbTaskId=null;
  function openLightbox(id,thumbEl){
    var x=load().find(function(t){return t.id===id});
    if(!x||!x.img)return;
    lbTaskId=id;
    var lb=document.getElementById('lightbox');
    lb.innerHTML='';delete lb.dataset.closing;
    var im=document.createElement('img');im.src=x.img;im.alt=x.text;
    var bar=document.createElement('div');bar.className='lbbar';
    var del=document.createElement('button');del.className='lbbtn danger';del.textContent='删除图片';
    del.addEventListener('click',function(){
      var list=load();list.forEach(function(t){if(t.id===id)t.img=null});
      save(list);render();closeLightbox();
    });
    var close=document.createElement('button');close.className='lbbtn';close.textContent='关闭';
    close.addEventListener('click',closeLightbox);
    bar.append(del,close);
    lb.append(im,bar);
    lb.hidden=false;
    // 共享元素：先量缩略图位置，展开动画从那里起步
    var from=thumbEl?thumbEl.getBoundingClientRect():null;
    if(reduceMotion||!from||!im.animate){lb.classList.add('open');return}
    lb.style.opacity='0';
    requestAnimationFrame(function(){
      var to=im.getBoundingClientRect();
      lb.style.opacity='';lb.classList.add('open');
      im.style.transformOrigin='top left';
      im.animate([
        {transform:'translate('+(from.left-to.left)+'px,'+(from.top-to.top)+'px) scale('+(from.width/to.width)+','+(from.height/to.height)+')',borderRadius:'6px'},
        {transform:'none',borderRadius:'8px'}
      ],{duration:300,easing:'cubic-bezier(.2,.7,.3,1)'});
    });
  }
  function closeLightbox(){
    var lb=document.getElementById('lightbox');
    if(lb.hidden||lb.dataset.closing)return;
    var im=lb.querySelector('img');
    function finish(){
      if(lb.dataset.closing!=='1')return; // 期间又被打开则放弃清理
      lb.classList.remove('open');lb.hidden=true;lb.innerHTML='';lbTaskId=null;
    }
    if(reduceMotion||!im||!im.animate){lb.dataset.closing='1';finish();return}
    lb.dataset.closing='1';
    var from=im.getBoundingClientRect();
    var li=lbTaskId?document.querySelector('li[data-id="'+lbTaskId+'"]'):null;
    var thumb=li?li.querySelector('.thumb'):null;
    var to=thumb?thumb.getBoundingClientRect():null;
    lb.classList.remove('open'); // 背景同步淡出，图片单独飞回
    var anim;
    if(to){ // 缩回缩略图的最新位置（期间列表重排也能找回）
      anim=im.animate([
        {transform:'none',borderRadius:'8px'},
        {transform:'translate('+(to.left-from.left)+'px,'+(to.top-from.top)+'px) scale('+(to.width/from.width)+','+(to.height/from.height)+')',borderRadius:'6px',opacity:.85}
      ],{duration:280,easing:'cubic-bezier(.4,0,.7,.2)',fill:'forwards'});
    }else{  // 图片已删除或任务不在：原地淡出
      anim=im.animate([{opacity:1},{opacity:0}],{duration:200,fill:'forwards'});
    }
    anim.onfinish=finish;
  }
  document.getElementById('lightbox').addEventListener('click',function(e){
    if(e.target===this)closeLightbox();
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLightbox()});

  /* ---- 提醒：ntfy 推送 / 日历文件 ---- */
  var remTaskId=null;
  function toLocalInput(d){
    function p(n){return String(n).padStart(2,'0')}
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());
  }
  function openRemind(id){
    var x=load().find(function(t){return t.id===id});
    if(!x)return;
    remTaskId=id;
    document.getElementById('remTaskName').textContent=x.text;
    document.getElementById('remTime').value=x.remind||toLocalInput(new Date(Date.now()+3600e3));
    document.getElementById('remPeriod').value=x.period;
    document.getElementById('remRepeat').value=x.repeat||'';
    try{
      var wx=JSON.parse(localStorage.getItem('dayplan.wx'))||{};
      document.getElementById('remWorker').value=wx.url||'';
      document.getElementById('remToken').value=wx.token||'';
      document.getElementById('remUid').value=wx.uid||'';
    }catch(e){}
    document.getElementById('remStatus').textContent='';
    document.getElementById('remDialog').hidden=false;
    requestAnimationFrame(function(){
      document.getElementById('remDialog').classList.add('open');
    });
  }
  function closeRemind(){
    var dlg=document.getElementById('remDialog');
    if(dlg.hidden)return;
    dlg.classList.remove('open');
    setTimeout(function(){dlg.hidden=true;remTaskId=null},220);
  }
  ['remPeriod','remRepeat'].forEach(function(id){
    document.getElementById(id).addEventListener('change',function(){
      if(remTaskId==null)return;
      var sel=this,list=load();
      list.forEach(function(t){
        if(t.id!==remTaskId)return;
        if(id==='remPeriod')t.period=+sel.value;
        else{if(sel.value)t.repeat=sel.value;else delete t.repeat}
      });
      save(sortList(list));render();
    });
  });
  function setRemind(id,iso,via){
    var list=load();list.forEach(function(t){if(t.id===id){t.remind=iso;t.remindVia=via||'local'}});
    save(list);render();
  }
  document.getElementById('remClose').addEventListener('click',closeRemind);
  document.getElementById('remDialog').addEventListener('click',function(e){
    if(e.target===this)closeRemind();
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeRemind()});

  /* ---- 顺延确认弹窗 ---- */
  var cfmTaskId=null;
  function openCfm(id){
    var x=load().find(function(t){return t.id===id});
    if(!x)return;
    cfmTaskId=id;
    document.getElementById('cfmText').textContent='「'+x.text+'」';
    var dlg=document.getElementById('cfmDialog');
    dlg.hidden=false;
    requestAnimationFrame(function(){dlg.classList.add('open')});
  }
  function closeCfm(){
    var dlg=document.getElementById('cfmDialog');
    if(dlg.hidden)return;
    dlg.classList.remove('open');
    setTimeout(function(){dlg.hidden=true;cfmTaskId=null},220);
  }
  document.getElementById('cfmNo').addEventListener('click',closeCfm);
  document.getElementById('cfmYes').addEventListener('click',function(){
    var id=cfmTaskId;
    closeCfm();
    if(id==null)return;
    var list=load();
    var x=list.find(function(t){return t.id===id});
    if(!x)return;
    var d=parse(state.date);d.setDate(d.getDate()+1);
    var nd=fmt(d),arr;
    try{arr=JSON.parse(localStorage.getItem(KEY+nd))||[]}catch(e){arr=[]}
    x.carried=true;x.remind=null;x.remindVia=null;
    arr.push(x);
    try{localStorage.setItem(KEY+nd,JSON.stringify(arr))}catch(e){}
    save(sortList(list.filter(function(t){return t.id!==id})));
    render();
  });
  document.getElementById('cfmDialog').addEventListener('click',function(e){
    if(e.target===this)closeCfm();
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&!document.getElementById('cfmDialog').hidden)closeCfm();
  });
  var BRIDGE_KEY='dayplan-momo-7f3k9';
  document.getElementById('remWx').addEventListener('click',function(){
    var url=document.getElementById('remWorker').value.trim().replace(/\/+$/,'');
    var token=document.getElementById('remToken').value.trim();
    var uid=document.getElementById('remUid').value.trim();
    var v=document.getElementById('remTime').value;
    var st=document.getElementById('remStatus');
    if(!v){st.textContent='⚠️ 请先选择提醒时间';return}
    if(!token||!uid){st.textContent='⚠️ 请先填写 appToken 和 UID（WxPusher 控制台获取）';return}
    var when=new Date(v).getTime();
    if(isNaN(when)||when-Date.now()<60e3){st.textContent='⚠️ 提醒时间请设在 1 分钟以后';return}

    function buildHead(label,cls,cnt){
      var li=document.createElement('li');

  function toggle(id){
    var list=load();
    var x=list.find(function(t){return t.id===id});
    if(!x)return;
    x.done=!x.done;
    // 重复任务：完成后在对应日期生成下一期
    if(x.done&&x.repeat){
      var d=parse(state.date);
      if(x.repeat==='daily')d.setDate(d.getDate()+1);
      else if(x.repeat==='weekly')d.setDate(d.getDate()+7);
      else d.setMonth(d.getMonth()+1);
      var nd=fmt(d),arr;
      try{arr=JSON.parse(localStorage.getItem(KEY+nd))||[]}catch(e){arr=[]}
      arr.push({id:Date.now()+''+Math.floor(Math.random()*1e4),text:x.text,pri:x.pri,
        period:x.period,done:false,img:null,repeat:x.repeat,created:Date.now()});
      try{localStorage.setItem(KEY+nd,JSON.stringify(arr))}catch(e){}
    }
    // 完成时先在原地播动画：描勾(0.1-0.6s)→划线(0.35-0.85s)→淡出下沉(0.95-1.35s)，结束后再沉入已完成栏
    var li=x.done?document.querySelector('li[data-id="'+id+'"]'):null;
    save(sortList(list));
    if(li&&!li.classList.contains('done')){
      li.classList.add('completing');
      setTimeout(function(){li.classList.add('leaving')},950);
      setTimeout(render,1350);
      return;
    }
    render();
  }

  function renderCal(){

    var marks={};

    var tr=null;

      if((d+offset-1)%7===0){tr=document.createElement('tr');table.append(tr)}

  // 触摸左右滑动切换相邻日期（跟手拖动 + 滑出/滑入转场）
  var sheet=document.querySelector('.sheet');
  var swipe={x0:0,y0:0,dx:0,lock:null,animating:false,t0:0};
  function swipeReset(){sheet.style.transform='';sheet.style.opacity='';sheet.classList.remove('swiping')}
  sheet.addEventListener('touchstart',function(e){
    if(!swipe.animating){
      sheet.classList.remove('swiping');
      sheet.style.transform='';sheet.style.opacity='';
    }
    if(swipe.animating||e.touches.length!==1)return;
    swipe.x0=e.touches[0].clientX;swipe.t0=Date.now();
    swipe.y0=e.touches[0].clientY;
    swipe.dx=0;swipe.lock=null;
  },{passive:true});
  sheet.addEventListener('touchcancel',function(){
    sheet.classList.remove('swiping');
    sheet.style.transform='';sheet.style.opacity='';
    swipe.lock=null;swipe.dx=0;
  });
  sheet.addEventListener('touchmove',function(e){
    if(swipe.animating||swipe.lock==='no')return;
    var t=e.touches[0];
    var dx=t.clientX-swipe.x0,dy=t.clientY-swipe.y0;
    if(swipe.lock===null){
      if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
      swipe.lock=Math.abs(dx)>Math.abs(dy)?'x':'no';
    }
    if(swipe.lock!=='x')return;
    e.preventDefault();
    swipe.dx=dx;sheet.classList.add('swiping');
    sheet.style.transition='none';
    sheet.style.transform='translateX('+dx*0.7+'px)';
    sheet.style.opacity=String(1-Math.min(.4,Math.abs(dx)/500));
  },{passive:false});
  sheet.addEventListener('touchend',function(e){
    var wasLocked=swipe.lock==='x';
    swipe.lock=null;
    if(swipe.animating||!wasLocked)return;
    // 用手指最终位置判定（快速轻扫时最后的 touchmove 可能位移不足）
    var t=e.changedTouches[0];
    var dx=t.clientX-swipe.x0;
    var dt=Date.now()-(swipe.t0||0);
    var w=window.innerWidth*0.35;
    swipe.animating=true;
    // 卡死自愈：无论转场是否正常收尾，600ms 后强制恢复可滑动状态
    setTimeout(function(){
      if(swipe.animating){swipe.animating=false;swipeReset()}
    },700);
    var go=Math.abs(dx)>60||(Math.abs(dx)>35&&dt<250); // 慢滑 60px / 快甩 35px
    if(!go){ // 未过阈值：弹回
      var back=sheet.animate([
        {transform:sheet.style.transform,opacity:+sheet.style.opacity||1},
        {transform:'none',opacity:1}
      ],{duration:150,easing:'ease-out'});
      back.onfinish=function(){swipeReset();swipe.animating=false};
      return;
    }
    var dir=dx<0?1:-1; // 左滑→下一天，右滑→前一天
    var out=sheet.animate([
      {transform:sheet.style.transform,opacity:+sheet.style.opacity||1},
      {transform:'translateX('+(-dir*w)+'px)',opacity:0}
    ],{duration:130,easing:'ease-in'});
    out.onfinish=function(){
      try{
        shift(dir); // 换日期并重渲染
      }catch(err){}
      sheet.style.transform='translateX('+(dir*w)+'px)';
      sheet.style.opacity='0';
      var inp=sheet.animate([
        {transform:'translateX('+(dir*w)+'px)',opacity:0},
        {transform:'none',opacity:1}
      ],{duration:170,easing:'ease-out'});
      inp.onfinish=function(){swipeReset();swipe.animating=false};
    };
  });

  /* ---- 未完成顺延：旧日期未完成且非重复的任务，移到今天 ---- */
  function rollover(){
    var today=todayStr(),moved=[];
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(!k||k.indexOf(KEY)!==0)continue;
      var d=k.slice(KEY.length);
      if(d>=today)continue;
      var arr;
      try{arr=JSON.parse(localStorage.getItem(k))||[]}catch(e){continue}
      var keep=arr.filter(function(x){
        if(!x.done&&!x.repeat){moved.push(x);return false}
        return true;
      });
      if(keep.length!==arr.length)localStorage.setItem(k,JSON.stringify(keep));
    }
    if(!moved.length)return;
    var list=load();
    moved.forEach(function(x){x.carried=true;list.push(x)});
    save(sortList(list));
  }

  try{rollover()}catch(e){}
  render();
  /* ---- 页面内定时器：到点直发 WxPusher ---- */
  var wxTimers={};
  function getWxCfg(){
    try{return JSON.parse(localStorage.getItem('dayplan.wxd'))||{}}catch(e){return{}}
  }
  function fireWx(id){
    var x=load().find(function(t){return t.id===id});
    if(!x||!x.remind)return;
    var cfg=getWxCfg();
    if(!cfg.token||!cfg.uid)return;
    fetch('https://wxpusher.zjiecode.com/api/send/message',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({appToken:cfg.token,content:'⏰ 待办提醒：'+x.text,
        summary:'待办提醒：'+x.text.slice(0,30),contentType:1,uids:[cfg.uid]})
    }).then(function(r){return r.json()}).then(function(j){
      if(j&&j.success){ // 发送成功后清除提醒标记
        var list=load();list.forEach(function(t){if(t.id===id)t.remind=null});
        save(list);render();
      }
    }).catch(function(){ /* 网络失败：保留标记，下分钟重试 */ });
  }
  function armWx(x){
    if(!x.remind||x.remindVia==='server'){clearTimeout(wxTimers[x.id]);return} // 服务器调度的由服务器负责
    var delay=new Date(x.remind)-Date.now();
    clearTimeout(wxTimers[x.id]);
    if(isNaN(delay))return;
    if(delay<=0){ // 页面打开时已过期但未发送：24 小时内补发一次
      if(delay>-86400e3)setTimeout(function(){fireWx(x.id)},5000);
      return;
    }
    wxTimers[x.id]=setTimeout(function(){fireWx(x.id)},Math.min(delay,2147483000));
  }

    document.body.classList.remove('noselect');
  }
  function ddBegin(e,li){
    if(swipe.animating||DD.active)return;
    if(e.target.closest('button,img,input,select,.ptag'))return;
    DD.li=li;DD.id=li.dataset.id;DD.active=false;DD.dy=0;
    DD.y0=e.clientY;DD.x0=e.clientX;
    DD.mouse=e.pointerType==='mouse';
    if(!DD.mouse){ // 触摸：长按 350ms 进入拖拽
      DD.timer=setTimeout(function(){ddStart(li)},350);
    } // 鼠标：移动超过 6px 才进入（见 ddMove），避免干扰双击编辑
    document.addEventListener('pointermove',ddMove);
    document.addEventListener('pointerup',ddEnd);
    document.addEventListener('pointercancel',ddEnd);
  }
  function ddStart(li){
    if(DD.active)return;
    DD.active=true;
    var x=load().find(function(t){return t.id===DD.id});
    DD.section=x?x.period:null;
    li.classList.add('dragging');
    if(navigator.vibrate)navigator.vibrate(30);
    document.body.classList.add('noselect');
    document.addEventListener('touchmove',ddTouch,{passive:false});
  }
  function ddMove(e){
    if(!DD.li)return;
    if(!DD.active){
      var moved=Math.abs(e.clientY-DD.y0)>6||Math.abs(e.clientX-DD.x0)>6;
      if(DD.mouse&&moved)ddStart(DD.li); // 鼠标：移动即拖
      else if(!DD.mouse&&moved)ddCleanup(); // 触摸：动了就是滚动/滑动，放弃拖拽
      return;
    }
    if(e.cancelable)e.preventDefault();
    DD.dy=e.clientY-DD.y0;
    DD.li.style.transform='translateY('+DD.dy+'px)';
    DD.target=null;
    var r=DD.li.getBoundingClientRect();
    var midY=r.top+r.height/2;
    var sibs=document.querySelectorAll('li[data-period="'+DD.section+'"]:not(.done)');
    for(var i=0;i<sibs.length;i++){
      var sib=sibs[i];
      if(sib===DD.li)continue;
      var sr=sib.getBoundingClientRect();
      if(midY>sr.top&&midY<sr.bottom)DD.target=sib;
    }
  }
  function ddEnd(){
    ddCleanup();
    if(!DD.active||!DD.li){DD.li=null;return}
    var li=DD.li,id=DD.id,tg=DD.target,section=DD.section;
    li.classList.remove('dragging');li.style.transform='';
    DD.active=false;DD.li=null;DD.target=null;
    if(!tg){render();return}
    var orderIds=[];
    var nodes=document.querySelectorAll('li[data-period="'+section+'"]:not(.done)');
    for(var i=0;i<nodes.length;i++)orderIds.push(nodes[i].dataset.id);
    var noDrag=orderIds.filter(function(t){return t!==id});
    var to=noDrag.indexOf(tg.dataset.id);
    if(to<0){render();return}
    noDrag.splice(to,0,id);
    var list=load();
    noDrag.forEach(function(tid,idx){
      var t=list.find(function(z){return z.id===tid});
      if(t)t.ord=idx;
    });
    save(sortList(list));render();
  }

  /* ---- 全局搜索 ---- */
  var searchPanel=document.getElementById('searchPanel');
  var searchInput=document.getElementById('searchInput');
  var searchResults=document.getElementById('searchResults');
  document.getElementById('searchBtn').addEventListener('click',function(e){
    e.stopPropagation();
    searchPanel.hidden=!searchPanel.hidden;
    document.getElementById('calPanel').hidden=true;
    if(!searchPanel.hidden){
      searchInput.value='';
      searchResults.innerHTML='<div class="tnote">输入关键词，搜索所有日期的待办</div>';
      searchInput.focus();
    }
  });
  searchInput.addEventListener('input',function(){
    var q=this.value.trim().toLowerCase();
    searchResults.innerHTML='';
    if(!q)return;
    var hits=[];
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(!k||k.indexOf(KEY)!==0)continue;
      var d=k.slice(KEY.length),arr;
      try{arr=JSON.parse(localStorage.getItem(k))||[]}catch(e){continue}
      arr.forEach(function(x){
        if(x.text&&x.text.toLowerCase().indexOf(q)>=0)hits.push({d:d,x:x});
      });
    }
    hits.sort(function(a,b){return a.d<b.d?-1:1});
    if(!hits.length){searchResults.innerHTML='<div class="tnote">没有匹配的待办</div>';return}
    hits.forEach(function(h){
      var row=document.createElement('div');row.className='sres';
      var sd=document.createElement('span');sd.className='sd';
      sd.textContent=h.d.slice(5)+(h.x.done?' ✓':'');
      var nm=document.createElement('span');nm.className='sn';
      nm.textContent=(PERIOD[h.x.period]!=null?PERIOD[h.x.period]+' · ':'')+h.x.text;
      row.append(sd,nm);
      row.addEventListener('click',function(){
        searchPanel.hidden=true;
        state.date=h.d;render();
        var li=document.querySelector('li[data-id="'+h.x.id+'"]');
        if(li){li.scrollIntoView({block:'center'});
          li.classList.remove('flash');void li.offsetWidth;li.classList.add('flash');}
      });
      searchResults.append(row);
    });
  });

  /* ---- 深浅色主题 ---- */
  var themeBtn=document.getElementById('themeBtn');
  function applyTheme(){
    var t=localStorage.getItem('dayplan.theme')||'dark';
    document.body.classList.toggle('light',t==='light');
    themeBtn.textContent=t==='light'?'🌙':'☀️';
  }
  themeBtn.addEventListener('click',function(){
    var t=(localStorage.getItem('dayplan.theme')||'dark')==='light'?'dark':'light';
    localStorage.setItem('dayplan.theme',t);applyTheme();
  });
  applyTheme();

  /* ---- 系统分享接收（PWA share_target） ---- */
  (function(){
    var sp=new URLSearchParams(location.search);
    var txt=(sp.get('text')||sp.get('title')||'').trim();
    var u=(sp.get('url')||'').trim();
    if(!txt&&!u)return;
    document.getElementById('newTask').value=(txt+(u&&txt?' '+u:u||'')).slice(0,120);
    history.replaceState(null,'',location.pathname);
  })();

  render();

  // 顶栏实时时钟

  // 顶栏实时时钟
  var clockEl=document.getElementById('clock');
  function tickClock(){
    var d=new Date();
    clockEl.textContent=[d.getHours(),d.getMinutes(),d.getSeconds()]
      .map(function(n){return String(n).padStart(2,'0')}).join(':');
  }
  tickClock();
  setInterval(tickClock,1000);
  setInterval(tickClock,60000);
  syncPeriod();
})();
</script>
